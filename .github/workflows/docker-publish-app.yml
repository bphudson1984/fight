name: Build & Publish MATHS FIST App Image

on:
  push:
    branches: [main]
    paths:
      - index.html
      - src/**
      - package.json
      - package-lock.json
      - docker/**
      - .dockerignore
      - e2e/**
      - playwright.config.js
      - .github/workflows/docker-publish-app.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - src/**
      - package.json
      - package-lock.json
      - docker/**
      - .dockerignore
      - e2e/**
      - playwright.config.js
      - .github/workflows/docker-publish-app.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/maths-fist

jobs:
  build-and-push:
    name: Build, test & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: maths-fist:ci
          cache-from: type=gha

      - name: Start container
        run: |
          docker run -d --name mf -p 56432:8080 maths-fist:ci
          for i in $(seq 1 20); do
            curl -fsS -o /dev/null http://localhost:56432/healthz && break
            sleep 1
          done

      - name: Smoke test
        run: |
          fail=0
          check() { if curl -fsS -o /dev/null "http://localhost:56432$1"; then echo "OK   $1"; else echo "FAIL $1"; fail=1; fi; }
          check /healthz
          check /
          # Every JS/CSS/font asset referenced by the built page must be served.
          for a in $(curl -fsS http://localhost:56432/ | grep -oE '/assets/[^"]+' | sort -u); do check "$a"; done
          css=$(curl -fsS http://localhost:56432/ | grep -oE '/assets/[^"]+\.css' | head -1)
          for a in $(curl -fsS "http://localhost:56432$css" | grep -oE '/assets/[^)]+\.woff2' | sort -u); do check "$a"; done
          if curl -fsS http://localhost:56432/ | grep -q fonts.googleapis; then echo "FAIL page still loads Google Fonts"; fail=1; fi
          if [ "$fail" -ne 0 ]; then docker logs mf; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Playwright tests against the container
        env:
          CI: 'true'
          BASE_URL: http://localhost:56432
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Container logs
        if: failure()
        run: docker logs mf

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
